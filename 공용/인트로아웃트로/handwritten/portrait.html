<!doctype html>
<html data-composition-variables='[
  {"id":"text","type":"string","label":"Text","default":"동심지키미 in 가평"},
  {"id":"sub","type":"string","label":"Sub","default":""}
]'>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Nanum Pen Script"; src: url("NanumPenScript-Regular.ttf"); }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000;
           font-family: "Nanum Pen Script", cursive; color: #fff; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #words { position: absolute; inset: 0; }
  .word { position: absolute; font-size: 130px; line-height: 1; white-space: nowrap;
          text-shadow: 0 2px 14px rgba(0, 0, 0, .35); }
  #sub { position: absolute; right: 6%; bottom: 7%; font-size: 56px; opacity: .9;
          text-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
</style>
</head>
<body>
<div id="stage" data-composition-id="card" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <video id="bg" class="clip" src="bg.mp4" muted playsinline data-start="0" data-duration="3" data-track-index="0"></video>
  <div id="words" class="clip" data-start="0" data-duration="3" data-track-index="1"></div>
  <div id="sub" class="clip" data-start="0" data-duration="3" data-track-index="2"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    // 단어를 왼쪽 위 → 오른쪽 아래 대각선으로 흩어 놓는다 ("동심지키미 / in / 가평")
    const LEFT = [8, 48], TOP = [34, 60];
    const { text, sub } = window.__hyperframes.getVariables();
    const words = text.split(/\s+/).filter(Boolean);
    const box = document.getElementById("words");
    words.forEach((w, k) => {
      const t = words.length > 1 ? k / (words.length - 1) : 0;
      const el = document.createElement("div");
      el.className = "word";
      el.textContent = w;
      el.style.left = `${LEFT[0] + (LEFT[1] - LEFT[0]) * t}%`;
      el.style.top = `${TOP[0] + (TOP[1] - TOP[0]) * t}%`;
      box.appendChild(el);
    });
    document.getElementById("sub").textContent = sub;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(".word", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.45, ease: "power2.out" }, 0.3)
      .fromTo("#sub", { opacity: 0 }, { opacity: 0.9, duration: 0.5 }, 1.4);
    window.__timelines.card = tl;
  </script>
</div>
</body>
</html>
