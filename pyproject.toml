[project]
name = "snapcut"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "pillow>=11",
  "pillow-heif>=0.21",
  "numpy>=2.1",
  "opencv-python-headless>=4.10",
  "imagehash>=4.3",
  "scenedetect>=0.6.5",
  "librosa>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
markers = ["slow: ffmpeg/Remotion/HyperFrames 렌더까지 도는 E2E"]
addopts = "-m 'not slow'"
